permissions:
  contents: write
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Remove Aliyun mirror repositories (unreachable from GitHub-hosted runners)
        run: sed -i '/maven\.aliyun\.com/d' settings.gradle.kts

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.YOUR_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8/' gradle.properties
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-v*.apk

      # Actions 产物 zip 匿名下载会 401。预发布标签上的 APK 公开可下，应用走这条。
      - name: Publish CI packages for anonymous download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          src=app/build/outputs/apk/release
          stage=$(mktemp -d)
          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            match=$(find "$src" -maxdepth 1 -name "Han1meViewer-v*-${abi}.apk" -print -quit)
            test -n "$match"
            cp "$match" "$stage/Han1meViewer-${abi}.apk"
          done
          if gh release view ci >/dev/null 2>&1; then
            gh release edit ci --target "$GITHUB_SHA" --title "CI $GITHUB_SHA" --notes "$GITHUB_SHA" --prerelease
          else
            gh release create ci --target "$GITHUB_SHA" --title "CI $GITHUB_SHA" --notes "$GITHUB_SHA" --prerelease
          fi
          gh release upload ci "$stage"/Han1meViewer-*.apk --clobber
